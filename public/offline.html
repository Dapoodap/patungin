<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Patungan</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #FFFDF5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #121212;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #FFFFFF;
      border: 4px solid #121212;
      box-shadow: 8px 8px 0px #121212;
      max-width: 440px;
      width: 100%;
      padding: 32px 24px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #FFE600;
      border: 2px solid #121212;
      font-weight: 900;
      font-size: 14px;
      padding: 4px 12px;
      margin-bottom: 18px;
      box-shadow: 3px 3px 0px #121212;
      text-transform: uppercase;
    }
    h1 {
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 12px;
      line-height: 1.2;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: #555555;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: #00F090;
      color: #121212;
      border: 3px solid #121212;
      box-shadow: 4px 4px 0px #121212;
      font-weight: 800;
      font-size: 15px;
      padding: 12px 28px;
      cursor: pointer;
      text-transform: uppercase;
      text-decoration: none;
      transition: transform 0.1s;
    }
    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #121212;
    }
    .note {
      margin-top: 24px;
      font-size: 11px;
      color: #777777;
      border-top: 2px dashed #CCCCCC;
      padding-top: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Koneksi Terputus 📡</div>
    <h1>Kamu Sedang Offline</h1>
    <p>
      Demi menjaga kerahasiaan dan privasi data bersama, informasi saldo dan pengeluaran grup <b>tidak disimpan di cache peramban</b>.
    </p>
    <button class="btn" onclick="window.location.reload()">
      🔄 Coba Lagi
    </button>
    <div class="note">
      Hubungkan kembali perangkat Anda ke jaringan WiFi atau seluler untuk melanjutkan patungan.
    </div>
  </div>
</body>
</html>
